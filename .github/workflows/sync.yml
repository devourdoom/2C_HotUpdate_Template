name: Sync official levels

on:
  schedule:
    - cron: "*/10 * * * *" # GitHub may delay or skip runs under load; 5 min is the minimum
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-official
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pycryptodome

      - name: Fetch official levels into raw/
        run: python sync_official.py

      - name: Commit and trigger a build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw state
          git commit -F .sync_message
          git push
          # pushes made with GITHUB_TOKEN don't fire other workflows, so start the build explicitly
          gh workflow run build.yml
