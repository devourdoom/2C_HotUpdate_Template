name: Build and publish level bundles

on:
  push:
    branches: [main, master]
    paths: ["raw/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pycryptodome

      - name: Build a bundle for every platform/version under raw/
        id: build
        run: |
          for cv_dir in raw/*/*/; do
            [ -d "$cv_dir" ] || continue
            platform_dir="$(dirname "$cv_dir")"
            platform="$(basename "$platform_dir")"
            path_platform="${platform%_beta}"
            cv="$(basename "$cv_dir")"
            echo "::group::$platform/$cv"

            hash="$(python fetch_real_hash.py "$cv" --platform "$platform" | sed -n 's/^hash:[[:space:]]*//p')"
            if [ -z "$hash" ]; then
              echo "no real hash for $cv ($platform) right now -- skipping (the game isn't asking for a bundle at this version)"
              echo "::endgroup::"
              continue
            fi

            python -c "from main import build_bundle; from pathlib import Path; build_bundle(\"$cv\", Path(\"$cv_dir\"), Path(\"dist/hotupdate/$path_platform/level_shipping/$cv\"), \"$hash\")"
            echo "::endgroup::"
          done
          [ -d dist ] && echo "publish=true" >> "$GITHUB_OUTPUT" || echo "nothing built, nothing to publish"

      - name: Publish to gh-pages
        if: steps.build.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
