name: Build and publish level bundles

on:
  push:
    branches: [main, master]
    paths: ["raw/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pycryptodome

      - name: Build a bundle for every variant/platform/version under raw/
        run: |
          for cv_dir in raw/*/*/*/; do
            platform_dir="$(dirname "$cv_dir")"
            variant="$(basename "$(dirname "$platform_dir")")"
            platform="$(basename "$platform_dir")"
            cv="$(basename "$cv_dir")"
            echo "::group::$variant/$platform/$cv"

            hash="$(python fetch_real_hash.py "$cv" --platform "$platform" | sed -n 's/^hash:[[:space:]]*//p')"
            if [ -z "$hash" ]; then
              echo "no real hash for $cv ($platform) right now -- skipping (the game isn't asking for a bundle at this version)"
              echo "::endgroup::"
              continue
            fi

            python -c "from main import build_bundle; from pathlib import Path; build_bundle(\"$cv\", Path(\"$cv_dir\"), Path(\"dist/$variant/hotupdate/$platform/level_shipping/$cv\"), \"$hash\")"
            echo "::endgroup::"
          done

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
